
rules:
  - id: flask-hardcoded-secret-key
    languages: [python]
    severity: ERROR
    message: >
      Hardcoded Flask SECRET_KEY detected. Load this value from an environment
      variable (e.g., os.environ["FLASK_SECRET_KEY"]) or a secrets manager instead.
    metadata:
      category: security
      technology:
        - flask
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"
    pattern-either:
      - pattern: |
          $APP = flask.Flask(...)
          ...
          $APP.secret_key = "..."
      - pattern: |
          $APP = flask.Flask(...)
          ...
          $APP.config["SECRET_KEY"] = "..."
      - pattern: |
          $APP = flask.Flask(...)
          ...
          $APP.config.update(..., SECRET_KEY="...", ...)
      - pattern: |
          SECRET_KEY = "..."
